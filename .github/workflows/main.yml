name: V59.1 FaIR 2.2.4 Reproduction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fair-reproduction:
    runs-on: ubuntu-latest

    steps:
      - name: Check out V59.1
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fair==2.2.4 pandas numpy

      - name: Download official FaIR 2.2.4 source
        run: |
          git clone --depth 1 --branch v2.2.4 https://github.com/OMS-NetZero/FAIR.git FAIR-v2.2.4

      - name: Build the documented 2184-2400 validation extension
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          src = Path("data/external_validation_net_co2_trajectory.csv")
          dst = Path(
              "external_validation_workflow/validation_input/"
              "external_validation_net_co2_trajectory_extended_to_2400.csv"
          )

          with src.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          if not rows:
              raise RuntimeError("Canonical V59.1 trajectory is empty")

          last = rows[-1]
          last_year = int(last["year"])
          last_net = float(last["net_co2_gtco2"])

          if last_year != 2183:
              raise RuntimeError(
                  f"Expected canonical trajectory to end in 2183, got {last_year}"
              )

          output = [
              {
                  "year": int(r["year"]),
                  "net_co2_gtco2": float(r["net_co2_gtco2"])
              }
              for r in rows
          ]

          for year in range(2184, 2401):
              output.append({
                  "year": year,
                  "net_co2_gtco2": last_net
              })

          dst.parent.mkdir(parents=True, exist_ok=True)

          with dst.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=["year", "net_co2_gtco2"]
              )
              writer.writeheader()
              writer.writerows(output)

          print("Created:", dst)
          print("Rows:", len(output))
          print("2183 net CO2:", last_net)
          print("2400 net CO2:", output[-1]["net_co2_gtco2"])
          PY

      - name: Run official FaIR 2.2.4 benchmark
        run: |
          python external_validation_workflow/scripts/run_fair_2_2_4.py \
            --fair-repo FAIR-v2.2.4 \
            --trajectory external_validation_workflow/validation_input/external_validation_net_co2_trajectory_extended_to_2400.csv \
            --outdir external_validation_results/fair_v59_1_reproduction

      - name: Display and verify result
        run: |
          cat external_validation_results/fair_v59_1_reproduction/fair_v2_2_4_summary.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "external_validation_results/fair_v59_1_reproduction/"
              "fair_v2_2_4_summary.json"
          )

          result = json.loads(p.read_text())

          print()
          print("FaIR version:", result["version"])
          print("Configurations:", result["configs"])
          print("Returning configurations:", result["returning_configs"])
          print("Non-return fraction:", result["nonreturn_fraction"])

          if result["configs"] != 841:
              raise RuntimeError(
                  f"Expected 841 calibrated configurations, got {result['configs']}"
              )
          PY

      - name: Commit reproduction results to validation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add external_validation_results/fair_v59_1_reproduction
          git add external_validation_workflow/validation_input/external_validation_net_co2_trajectory_extended_to_2400.csv

          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Reproduce FaIR 2.2.4 benchmark for V59.1"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Save downloadable validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: fair-v59-1-reproduction
          path: external_validation_results/fair_v59_1_reproduction/
